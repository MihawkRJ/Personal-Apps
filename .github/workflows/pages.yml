# Publica os apps web (ex.: Revelador) no GitHub Pages.
# Endereço: https://mihawkrj.github.io/Personal-Apps/<pasta-do-app>/
name: Publicar apps web

on:
  push:
    branches: [main]
    paths:
      - "revelador/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar site
        run: |
          mkdir -p _site
          cp -r revelador _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=revelador/"><a href="revelador/">Revelador</a>\n' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
